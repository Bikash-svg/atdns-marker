<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Attendance Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #F4F2F6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p.desc { color: #666; font-size: 14px; margin: 0 0 20px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #5B7A4A;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 14px; margin-top: 14px; text-align: center; }
    .msg.error { color: #B3261E; }
    .msg.success { color: #2E7D32; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="desc">Enter a new password for your account.</p>
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)" minlength="6">
    <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6">
    <button id="submitBtn">Reset password</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    var API_BASE_URL = "http://localhost:5000/api"; // same value as in auth.js

    function getTokenFromURL() {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    var token = getTokenFromURL();
    var msgEl = document.getElementById('msg');
    var btn = document.getElementById('submitBtn');

    if (!token) {
      msgEl.textContent = 'This reset link is missing a token. Please request a new one.';
      msgEl.className = 'msg error';
      btn.disabled = true;
    }

    btn.addEventListener('click', function () {
      var pw = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;

      if (pw.length < 6) {
        msgEl.textContent = 'Password must be at least 6 characters.';
        msgEl.className = 'msg error';
        return;
      }
      if (pw !== confirm) {
        msgEl.textContent = 'Passwords do not match.';
        msgEl.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting…';

      fetch(API_BASE_URL + '/auth/reset-password/' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      })
        .then(function (res) {
          return res.json().then(function (json) {
            if (!res.ok) throw new Error(json.error || 'Something went wrong.');
            return json;
          });
        })
        .then(function (json) {
          msgEl.textContent = json.message + ' You can close this tab and log in.';
          msgEl.className = 'msg success';
          btn.style.display = 'none';
        })
        .catch(function (err) {
          msgEl.textContent = err.message;
          msgEl.className = 'msg error';
          btn.disabled = false;
          btn.textContent = 'Reset password';
        });
    });
  </script>
</body>
</html>
